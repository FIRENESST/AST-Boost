# AST-Full protocol mirror. Kern and Full share labels, kernel, backbone,
# optimizer, data splits and paired seeds; only the legal second-order fields
# are added here.
experiment:
  name: zinc_ast_full_graphgps
  status: protocol_mirror
  seeds: [42, 43, 44, 45, 46]
  graphgps_reference_commit: 28015707cbab7f8ad72bed0ee872d068ea59c94b

data:
  name: ZINC
  subset: true
  splits: [train, val]
  test_access: disabled_until_protocol_freeze

precompute:
  cache_version: 3
  laplacian: sym
  k: 8
  skip_zero: true
  degeneracy_relative_gap: 1.0e-2
  degeneracy_tau: 1.0e-6
  sparse_sigma: -1.0e-5

ast:
  variant: full
  frequency_labels: eigenvalue
  field_scaling: size
  sign_hidden_dim: 32
  sign_layers: 2
  pe_dim_per_order: 16
  second_order:
    enabled: true
    low_frequency_cutoff: 4
    include_diagonal_pairs: true
    exclude_any_pair_touching_nonsingleton_block: true
    shared_psi: true
  kernel:
    spectrum: retained_pe
    basis: bernstein
    order: 8
    block_clamp: true
    diagonal_node_channel: false
    standardize_off_diagonal: true
    epsilon: 1.0e-6

gps:
  implementation: graphgps_compatible_standalone
  hidden_dim: 64
  layers: 10
  heads: 4
  local_model: GINE
  global_model: Transformer
  dropout: 0.0
  attention_dropout: 0.5
  batch_norm: true
  graph_pooling: add
  head: san_graph

train:
  loss: l1
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 32
  max_epochs: 2000
  scheduler: cosine_with_warmup
  warmup_epochs: 50
  gradient_clip_norm: 1.0
