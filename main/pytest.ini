[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    sign_invariance: checks invariance to independent eigenvector sign flips.
    degeneracy: checks invariance and safety under rotations within degenerate eigenspaces.
    permutation: checks node-permutation equivariance.
    kernel_invariance: checks block-clamped spectral-kernel invariance.
